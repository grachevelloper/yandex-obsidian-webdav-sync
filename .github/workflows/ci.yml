name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Community scanner rules
        run: npm run lint:community
      - name: Current recommended rules
        run: npm run lint:recommended
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webdav-sync-for-yandex-disk
          path: release/webdav-sync-for-yandex-disk/
          if-no-files-found: error
